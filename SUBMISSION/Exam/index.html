<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Expense Tracker</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h1>

      <div class="summary-section">
        <div class="card">
          <h3>Income</h3>
          <p id="total-income" style="color: green">₹0.00</p>
        </div>
        <div class="card">
          <h3>Expenses</h3>
          <p id="total-expenses" style="color: red">₹0.00</p>
        </div>
        <div class="card">
          <h3>My Balance</h3>
          <p id="balance">₹0.00</p>
        </div>
      </div>

      <div class="layout">
        <div class="form-container">
          <h2>Add New Entry</h2>
          <form id="expense-form">
            <input
              type="text"
              id="name"
              placeholder="What did you buy?"
              required
            />
            <input
              type="number"
              id="amount"
              placeholder="Amount (₹)"
              required
            />
            <input type="date" id="date" required />
            <select id="category">
              <option value="Income">Income (+)</option>
              <option value="Expense">Expense (-)</option>
            </select>
            <button type="submit" class="btn-primary">Add to List</button>
          </form>
        </div>

        <div class="list-container">
          <h2>History</h2>
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="transaction-list"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="src/script.js"></script>
  </body>
</html>
